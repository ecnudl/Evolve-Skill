name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest (upstream regression suite)
        # Keep the original regression suite separate from optional research
        # tests requiring licensed local data or the macOS native sandbox.
        # New upstream regression modules should be added to this manifest.
        run: xargs python -m pytest -q < configs/ci/upstream-tests.txt
        env:
          # Live backend/transcript tests are opt-in (gated on == "1"); keep
          # them off in CI so the run stays hermetic and fast.
          SKILLOPT_TEST_REAL_OPENCODE: "0"
          SKILLOPT_TEST_REAL_OPENCODE_SOURCE: "0"

  research-offline:
    name: Research V18 and validation offline
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install research test dependencies
        run: pip install -e ".[dev,searchqa,cross-domain,validator-pilot]"
      - name: Pytest (synthetic data, mocked API and native executor)
        run: >-
          python -m pytest -q
          tests/test_coevolution_v18_*.py tests/test_skill_validation_*.py
          tests/test_continual_eval_*.py tests/test_continual_learning_*.py
          tests/test_long_*.py tests/test_bcb_public_examples.py
          tests/test_monitor_experiment_jobs.py tests/test_kor_deliverable_diagnostic.py
          tests/test_native_handoff.py tests/test_process_handoff.py tests/test_pool_guard_controls.py
          tests/test_full_delivery_recovery.py tests/test_native_unknown_replay.py
          tests/test_sheet_v6_replay.py tests/test_sheet_v7_replay.py
          tests/test_sheet_functions_replay.py
          tests/test_sheet_passive_links_replay.py
          tests/test_fivebench_continuation.py tests/test_fivebench_continuation_integration.py
          tests/test_fivebench_generalization_report.py tests/test_bigmodel_budget_probe.py
          tests/test_sheet_frozen_gold_replay.py tests/test_sheet_frozen_gold_review.py
          tests/test_sheet_frozen_gold_metadata.py tests/test_sheet_frozen_gold_metadata_review.py
          tests/test_sheet_delivery_outcomes_report.py tests/test_sheet_delivery_outcomes_review.py
          tests/test_fenced_delivery_replay.py
          tests/test_replay_fenced_with_frozen_h.py
          tests/test_sheet_length_recovery.py
          tests/test_prepare_learned_checkpoint.py tests/test_compare_baseline_checkpoints.py
          tests/test_validator_pilot_api.py
          tests/test_resume_natural_validation.py tests/test_spreadsheetbench_evaluator.py
          tests/test_research_evidence_demo.py
        env:
          HF_HUB_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"

  webui:
    # The Gradio theme-compatibility path only exists because gradio changed
    # where `theme` lives across majors: <6 puts it on Blocks, >=6 on launch().
    # The main `test` job installs only `.[dev]`, so those tests importorskip
    # and never exercise this code — run them here across both supported majors.
    # 5.50.0 is the DECLARED minimum in the `webui` extra (gradio>=5.50.0,<7),
    # so the matrix tests the actual floor, not just a mid-version.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gradio-version: ["5.50.0", "6.26.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (core + pinned gradio)
        run: pip install -e ".[dev]" "gradio==${{ matrix.gradio-version }}"
      - name: Pytest (gradio webui)
        run: python -m pytest tests/test_webui_build_gradio.py tests/test_webui_env_preflight.py -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[docs]" pytest
      - name: Check publication boundary
        run: python -m pytest tests/test_docs_publication_boundary.py -q
      - name: Build docs (strict)
        run: mkdocs build --strict
